name: "sshield-example-cli"
arch: "amd64"
platform: "linux"
version: "v1.0.0"
section: "default"
priority: "extra"
maintainer: "SSHield Team <team@sshield.dev>"
description: |
  Example CLI application demonstrating SSHield monorepo tooling.
  Built with TypeScript, Ink, and Commander.js.
vendor: "SSHield"
homepage: "https://github.com/shaiknoorullah/SSHield"
license: "MIT"

# Dependencies
depends:
  - nodejs (>= 18.0.0)

# Files to include in the package
contents:
  # Application files
  - src: ./dist
    dst: /usr/lib/sshield-example-cli
    type: dir

  # Package metadata
  - src: ./package.json
    dst: /usr/lib/sshield-example-cli/package.json
    type: file

  # Executable wrapper
  - src: ./scripts/example-cli.sh
    dst: /usr/bin/example-cli
    type: file
    file_info:
      mode: 0755

# Scripts
scripts:
  postinstall: |
    #!/bin/sh
    cd /usr/lib/sshield-example-cli
    npm install --production --ignore-scripts
    echo "example-cli installed successfully!"

  preremove: |
    #!/bin/sh
    echo "Removing example-cli..."

  postremove: |
    #!/bin/sh
    rm -rf /usr/lib/sshield-example-cli/node_modules
    echo "example-cli removed successfully!"

# Package formats
# Generate both .deb and .rpm
rpm:
  group: Development/Tools

deb:
  fields:
    Bugs: https://github.com/shaiknoorullah/SSHield/issues
